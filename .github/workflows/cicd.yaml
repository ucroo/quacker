    env:
      TARGET_REF: needs.build.outputs.git-ref
    if: ${{ success() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name:
        run: |
          mkdir -p quackerTemp
          echo "${{ env.TARGET_REF }}" > quackerTemp/RC_GIT_COMMIT
      - name: Push
        uses: dmnemec/copy_file_to_another_repo_action@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.FLOW_SERVER_PROVISIONING_API_TOKEN }}
        with:
          source_file: "quackerTemp/RC_GIT_COMMIT"
          destination_repo: "ucroo/flow-server-provisioning"
          destination_folder: "quackers"
          user_email: "ci@quacker.pathify.com"
          user_name: "Continuous Integration Quacker"
          commit_message: "updated RC to ${{ env.TARGET_REF }}"
